<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HustleHub+ | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <div class="plus-pattern plus-one">+</div>
        <div class="plus-pattern plus-two">+</div>
        <div class="plus-pattern plus-three">+</div>


        <div class="login-card">
            <div class="top-section">

                <div class="logo">
                    HustleHub<span>+</span>
                </div>

                <div class="status">
                    <span class="status-dot"></span>
                    Welcome back
                </div>

            </div>


            <!-- Heading -->
            <div class="heading">

                <p class="eyebrow">
                    WELCOME BACK
                </p>

                <h1>
                    Good to see<br>
                    you <span>again.</span>
                </h1>

                <p class="intro">
                    Log in to your HustleHub+ account and
                    pick up where you left off.
                </p>

            </div>


            <!-- Login form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <div class="label-row">

                        <label for="password">
                            Password
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword('password', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Remember me btn-->
                <div class="remember">

                    <label>

                        <input type="checkbox">

                        <span class="custom-checkbox"></span>

                        Remember me

                    </label>

                </div>


                <!-- Btn -->
                <button
                    type="submit"
                    class="login-btn"
                >

                    <span>Login to HustleHub+</span>


                </button>

            </form>


            <!-- Message -->
            <p id="loginMessage"></p>


            <!-- Register -->
            <div class="bottom">

                <span>Don't have an account?</span>

                <a href="register.html">
                    Create one
                </a>

            </div>


            <!-- Footer -->
            <div class="card-footer">

                <span>HustleHub+</span>

                <span>Build. Connect. Grow.</span>

            </div>

        </div>

    </div>


    <script src="script.js"></script>


    <script>

        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                button.textContent = "Hide";

            } else {

                input.type = "password";

                button.textContent = "Show";

            }

        }

    </script>

</body>

</html>
