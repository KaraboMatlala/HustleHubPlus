<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HustleHub+ | Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <div class="plus-pattern plus-one">+</div>
        <div class="plus-pattern plus-two">+</div>
        <div class="plus-pattern plus-three">+</div>


        <div class="register-card">

            <!-- Top -->
            <div class="top-section">

                <div class="logo">
                    HustleHub<span>+</span>
                </div>

                <div class="status">
                    <span class="status-dot"></span>
                    Join the hub
                </div>

            </div>


            <!-- Heading -->
            <div class="heading">

                <p class="eyebrow">
                    CREATE YOUR ACCOUNT
                </p>

                <h1>
                    Your hustle<br>
                    starts <span>here.</span>
                </h1>

                <p class="intro">
                    Create your account and start connecting,
                    building and growing with HustleHub+.
                </p>

            </div>


            <!-- Form -->
            <form id="registerForm">

                <div class="form-row">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Your full name"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create password"
                                required
                            >

                            <button
                                type="button"
                                data-toggle-password="registerPassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm password"
                                required
                            >

                            <button
                                type="button"
                                data-toggle-password="confirmPassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>

                </div>


                <!-- Password hint -->
                <div class="password-hint">

                    <span></span>

                    Password should contain at least 8 characters.

                </div>


                <!-- Btn-->
                <button
                    type="submit"
                    class="create-btn"
                >

                    <span>Create Account</span>

                </button>

            </form>


            <!-- Message -->
            <p id="registerMessage"></p>


            <!-- Bottom -->
            <div class="bottom">

                <span>Already have an account?</span>

                <a href="index.html">
                    Login
                </a>

            </div>


            <!-- Footer -->
            <div class="card-footer">

                <span>HustleHub+</span>

                <span>Build. Connect. Grow.</span>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
